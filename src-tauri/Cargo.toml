[package]
name = "openmydear"
version = "0.1.0"
description = "A desktop launcher to open multiple apps, files, and folders at once"
authors = ["you"]
edition = "2021"

[lib]
name = "openmydear_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

