name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            artifact-name: windows
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            artifact-name: macos-arm64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            artifact-name: macos-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install frontend dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        id: tauri-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Zip Windows artifacts
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $artifacts = '${{ steps.tauri-build.outputs.artifactPaths }}' | ConvertFrom-Json
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          foreach ($path in $artifacts) {
            Copy-Item $path -Destination release-assets/
          }
          Compress-Archive -Path "release-assets/*" -DestinationPath "OpenMyDear-${{ github.ref_name }}-windows-x64.zip"

      - name: Upload Windows artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: OpenMyDear-*-windows-x64.zip

      - name: Prepare macOS artifacts
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p release-assets
          echo '${{ steps.tauri-build.outputs.artifactPaths }}' | jq -r '.[]' | while read -r path; do
            cp "$path" release-assets/
          done

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: release-assets/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List release files
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'OpenMyDear ${{ github.ref_name }}'
          body: 'See the assets to download and install this version.'
          draft: true
          prerelease: false
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
